[project]
name = "credit-card-fraud-detection"
version = "0.1.0"
description = "Projeto de detecção de fraude em cartão de crédito"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "imbalanced-learn",
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
    "shap",
    "xgboost",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
